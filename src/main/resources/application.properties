spring.application.name=aw-chatbot
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/aw_chatbot
spring.datasource.username=aw_user
spring.datasource.password=aw_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.problemdetails.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/aw-chatbot
spring.security.oauth2.resourceserver.jwt.audiences=aw-chatbot-api


# ===============================
# AWS Bedrock / Spring AI
# ===============================

spring.ai.model.chat=bedrock-converse

spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.aws.profile.name=aw-chatbot-user

spring.ai.bedrock.converse.chat.model=us.amazon.nova-2-lite-v1:0
spring.ai.bedrock.converse.chat.temperature=0.2
spring.ai.bedrock.converse.chat.max-tokens=1000

# Temporary integration smoke test
app.ai.smoke-test.enabled=false