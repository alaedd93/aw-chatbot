services:
  postgres:
    image: postgres:17
    container_name: aw-chatbot-postgres
    environment:
      POSTGRES_DB: aw_chatbot
      POSTGRES_USER: aw_user
      POSTGRES_PASSWORD: aw_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: aw-chatbot-keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
    ports:
      - "127.0.0.1:9090:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  postgres_data:
  keycloak_data: